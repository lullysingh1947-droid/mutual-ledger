<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Mutual Ledger</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#152239;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#1d4ed8;color:white;font-weight:600}button.secondary{background:white;border:1px solid #d9dfeb;color:#253655}button:disabled{opacity:.45;cursor:not-allowed}a{color:#1d4ed8}header{background:#0f203a;color:white;padding:18px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.muted{color:#66748b}.hint{font-size:12px}.wrap{max-width:1190px;margin:auto;padding:28px 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e5ef;border-radius:15px;padding:19px;box-shadow:0 4px 18px #14284709;margin-bottom:16px}.number{font-size:27px;font-weight:800;margin:5px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stack{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:27px;margin:0 0 5px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.label{font-size:12px;font-weight:700;margin-bottom:6px;color:#475569}input,select,textarea{background:white;width:100%;padding:10px 12px;border:1px solid #ced6e4;border-radius:9px;color:#22324b}label{display:block;margin-bottom:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{margin:0}.badge{display:inline-block;border-radius:30px;font-size:11px;font-weight:700;padding:5px 9px;background:#e8eef9;color:#274778}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.line{border-top:1px solid #e7ebf2;margin:16px 0}.entry{border:1px solid #e2e7f0;padding:15px;border-radius:12px;margin:10px 0}.entry.partial{border-left:5px solid #e8a320;background:#fff9e9}.entry.complete{border-left:5px solid #22a465}.mini{font-size:13px}.bar{height:7px;background:#e9edf3;border-radius:9px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#e6a23a}.danger{color:#a91c1c}.linkbutton{background:none;color:#164ab3;padding:5px}.auth{max-width:445px;margin:60px auto}.notice{padding:12px;border-radius:10px;background:#eaf1ff;color:#244275;margin:12px 0}.error{background:#fff0ef;color:#a41a1a}.ledger-tile{cursor:pointer;transition:transform .15s}.ledger-tile:hover{transform:translateY(-2px);border-color:#739be9}.inlineinput{width:120px;display:inline-block}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}td,th{padding:10px;border-bottom:1px solid #e5e9f1;text-align:left;font-size:13px}th{color:#64748b}.pillbox{padding:5px 0}.nowrap{white-space:nowrap}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:14px}.number{font-size:23px}}
</style></head><body><header><div class="brand">◈ Mutual Ledger <span class="hint" style="font-weight:400;color:#b9c9e8">PRIVATE PILOT</span></div><div id="account"></div></header><main id="app" class="wrap"></main><script>
const $=id=>document.getElementById(id),fmt=(v,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(v/100),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));let token=sessionStorage.getItem('ml_token'),user=null,selected=null,ledgers=[];const invite=new URLSearchParams(location.search).get('invite');
async function api(path,method='GET',body){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function alertMessage(m,bad=false){let n=$('flash');if(n){n.className='notice '+(bad?'error':'');n.textContent=m;}}function shell(x){$('app').innerHTML='<div id="flash"></div>'+x}function authView(){user=null;$('account').innerHTML='';shell(`<div class="card auth"><h1>Welcome to Mutual Ledger</h1><p class="muted">Private supplier and accountant ledgers with mutual approvals.</p><div class="stack" style="margin:18px 0"><button id="showLogin">Sign in</button><button id="showRegister" class="secondary">Create account</button></div><div id="authform"></div></div>`);$('showLogin').onclick=()=>authForm(false);$('showRegister').onclick=()=>authForm(true);authForm(false)}
function authForm(reg){$('authform').innerHTML=`<form id="accountForm">${reg?'<label><div class="label">Your name</div><input name="name" required/></label><label><div class="label">Business name</div><input name="company" required/></label>':''}<label><div class="label">Email</div><input name="email" type="email" required/></label><label><div class="label">Password (minimum 10 characters for registration)</div><input name="password" type="password" required minlength="${reg?10:1}"/></label><button>${reg?'Register':'Sign in'}</button></form>`;$('accountForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));try{if(reg){await api('/register','POST',v);alertMessage('Account created. Please sign in.');authForm(false)}else{let d=await api('/login','POST',v);token=d.token;sessionStorage.setItem('ml_token',token);await boot()}}catch(e){alertMessage(e.message,true)}}}
function accountHeader(){$('account').innerHTML=`<span class="hint">${escapeHtml(user.company)} · ${escapeHtml(user.name)}</span> <button class="secondary" id="signout">Sign out</button>`;$('signout').onclick=async()=>{try{await api('/logout','POST')}catch(e){}sessionStorage.removeItem('ml_token');token=null;authView()}}
async function boot(){try{user=await api('/me');accountHeader();if(invite){try{let d=await api('/invite/'+encodeURIComponent(invite)+'/accept','POST');history.replaceState({},'',location.pathname);selected=d.ledger_id}catch(e){alert(e.message)}}await home()}catch(e){token=null;sessionStorage.removeItem('ml_token');authView()}}
async function home(){selected=null;ledgers=await api('/ledgers');shell(`<div class="row"><div><h1>Business ledgers</h1><p class="muted">Only invited parties can view or approve their shared records.</p></div><button id="newLedger">+ New ledger</button></div><div class="grid" id="tiles"></div><div id="createPanel"></div>`);$('tiles').innerHTML=ledgers.length?ledgers.map(l=>`<div class="card ledger-tile" data-ledger="${l.id}"><div class="row"><strong>${escapeHtml(l.title)}</strong><span class="badge">${l.kind==='supplier'?'Supplier':'Accountant'}</span></div><p class="muted mini">${escapeHtml(l.counterparty_company||l.invite_email)}</p><span class="badge ${l.counterparty_id?'ok':'warn'}">${l.counterparty_id?'Joined':'Invitation pending'}</span><p class="hint muted">${l.currency}</p></div>`).join(''):'<div class="card">No ledgers yet. Create your first one.</div>';$('tiles').onclick=e=>{let tile=e.target.closest('[data-ledger]');if(tile)detail(+tile.dataset.ledger)};$('newLedger').onclick=createView;if(invite===null&&selected)detail(selected)}
function createView(){$('createPanel').innerHTML=`<div class="card"><h2>Create a private ledger</h2><form id="createForm"><div class="fields"><label><div class="label">Ledger name</div><input name="title" placeholder="Example Supplier — Salai" required/></label><label><div class="label">Ledger type</div><select name="kind"><option value="supplier">Supplier ledger</option><option value="accountant">Accountant ledger</option></select></label><label><div class="label">Currency</div><select name="currency"><option>USD</option><option>CAD</option><option>PKR</option></select></label><label><div class="label">Other party's email</div><input name="invite_email" type="email" required/></label><label><div class="label">Opening balance (positive means amount owed to supplier / debit balance)</div><input name="opening" type="number" step="0.01" value="0" required/></label></div><p class="hint muted">You confirm the opening balance when creating this ledger. The invited party must independently approve it.</p><button>Create ledger and invitation</button></form><div id="invitelink"></div></div>`;$('createForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));try{let d=await api('/ledgers','POST',{title:v.title,kind:v.kind,currency:v.currency,invite_email:v.invite_email,opening_minor:Math.round(Number(v.opening)*100)});let link=location.origin+d.invite_path;$('invitelink').innerHTML=`<div class="notice">Share this private invitation link with <strong>${escapeHtml(v.invite_email)}</strong>. Email delivery is not integrated yet.<div style="overflow-wrap:anywhere;margin:7px 0">${escapeHtml(link)}</div><button class="secondary" id="copyInvite">Copy link</button> <button id="openLedger">Open ledger</button></div>`;$('copyInvite').onclick=()=>navigator.clipboard.writeText(link);$('openLedger').onclick=()=>detail(d.id)}catch(e){alertMessage(e.message,true)}}}
async function detail(id){selected=id;let data;try{data=await api('/ledgers/'+id)}catch(e){alertMessage(e.message,true);return}let l=data.ledger,side=l.side,c=l.currency;let entries=data.transactions,awaiting=entries.filter(x=>!x.approved);let allLines=entries.filter(x=>x.kind==='invoice'&&x.approved).flatMap(x=>x.lines);let pendingPieces=allLines.reduce((s,x)=>s+x.qty-x.confirmed_qty,0);let billValue=entries.filter(x=>x.kind==='invoice'&&x.approved).reduce((s,x)=>s+x.amount_minor,0);let fulfilledValue=allLines.reduce((s,x)=>s+Math.round(x.amount_minor*x.confirmed_qty/x.qty),0);let unpaid=allLines.reduce((s,x)=>s+x.reserved_qty-x.confirmed_qty,0);
shell(`<div class="row"><div><button class="secondary" id="back">← All ledgers</button><h1 style="margin-top:12px">${escapeHtml(l.title)}</h1><span class="badge">${l.kind==='supplier'?'Supplier ledger':'Accountant ledger'}</span> <span class="badge ${l.counterparty_id?'ok':'warn'}">${l.counterparty_id?'Both parties joined':'Invitation pending'}</span></div><div class="hint muted">${escapeHtml(c)} · ${side==='creator'?'Ledger creator':'Invited party'}</div></div><div class="grid" style="margin-top:20px"><div class="card"><div class="muted mini">Agreed balance (debits minus credits)</div><div class="number">${l.opening_approved?fmt(data.balance_minor,c):'Awaiting opening approval'}</div></div><div class="card"><div class="muted mini">${l.kind==='supplier'?'Approved invoice value':'Pending approvals'}</div><div class="number">${l.kind==='supplier'?fmt(billValue,c):awaiting.length}</div></div><div class="card"><div class="muted mini">${l.kind==='supplier'?'Fulfilled merchandise value':'Agreed opening balance'}</div><div class="number">${l.kind==='supplier'?fmt(fulfilledValue,c):fmt(l.opening_minor,c)}</div></div></div><div id="opening"></div><div class="row"><h2>Transactions</h2><div class="stack"><button class="secondary" id="creditBtn">+ Credit</button><button class="secondary" id="debitBtn">+ Debit</button>${l.kind==='supplier'?'<button id="invoiceBtn">+ Supplier invoice</button>':''}</div></div><div id="editor"></div><div id="entries"></div>${l.kind==='supplier'?`<div class="card"><h3>Fulfillment overview</h3><p class="mini">Pending pieces: <strong>${pendingPieces}</strong> · Deliveries awaiting confirmation: <strong>${unpaid}</strong> pieces · Unfulfilled merchandise value: <strong>${fmt(billValue-fulfilledValue,c)}</strong></p><p class="hint muted">Amber invoice lines remain highlighted until fully received and both parties confirm each delivery.</p></div>`:''}<div class="card"><h2>Audit history</h2><div id="audit"></div></div>`);
$('back').onclick=home;$('opening').innerHTML=`<div class="card"><div class="row"><div><h3>Opening balance: ${fmt(l.opening_minor,c)}</h3><div class="mini muted">Creator: ${l.opening_creator_ok?'Confirmed':'Pending'} · Invited party: ${l.opening_other_ok?'Confirmed':'Pending'}</div></div>${!l.opening_approved&&side==='other'?'<button id="approveOpening">Confirm opening balance</button>':`<span class="badge ${l.opening_approved?'ok':'warn'}">${l.opening_approved?'Agreed':'Awaiting approval'}</span>`}</div></div>`;if($('approveOpening'))$('approveOpening').onclick=()=>action('/ledgers/'+id+'/opening/approve');
for(let kind of ['credit','debit'])$(kind+'Btn').onclick=()=>entryForm(kind,id,c);if($('invoiceBtn'))$('invoiceBtn').onclick=()=>invoiceForm(id,c);
$('entries').innerHTML=entries.length?entries.map(t=>{let isApproved=t.approved,canApprove=t.created_by!==user.id&&!t.other_ok;let lineHTML=t.lines.map(line=>{let percent=Math.round(100*line.confirmed_qty/line.qty),isOpen=line.confirmed_qty<line.qty;return `<div class="entry ${isOpen?'partial':'complete'}"><div class="row"><strong>${escapeHtml(line.description)}</strong><span class="badge ${isOpen?'warn':'ok'}">${isOpen?'Unfulfilled':'Fulfilled'}</span></div><p class="mini">Ordered <b>${line.qty}</b> · Confirmed <b>${line.confirmed_qty}</b> · Pending <b>${line.qty-line.confirmed_qty}</b> · Value <b>${fmt(line.amount_minor,c)}</b> · Confirmed value <b>${fmt(Math.round(line.amount_minor*line.confirmed_qty/line.qty),c)}</b></p><div class="bar"><div class="fill" style="width:${percent}%"></div></div>${line.reserved_qty<line.qty?`<button class="secondary" data-deliver="${line.id}" data-max="${line.qty-line.reserved_qty}">Record partial/full delivery</button>`:''}${line.deliveries.map(d=>`<div class="mini pillbox">Delivery #${d.id} · ${d.qty} pieces · ${d.other_ok?'Both confirmed':'Awaiting other party'} ${!d.other_ok&&d.created_by!==user.id?`<button data-approve-delivery="${d.id}">Confirm ${d.qty} pieces</button>`:''}</div>`).join('')}</div>`}).join('');return `<div class="card"><div class="row"><div><strong>${escapeHtml(t.description)}</strong><p class="mini muted">${t.kind.toUpperCase()} · ${new Date(t.created_at).toLocaleString()}</p></div><div><strong>${fmt(t.amount_minor,c)}</strong> <span class="badge ${isApproved?'ok':'warn'}">${isApproved?'Approved':'Pending other party'}</span></div></div>${!isApproved&&canApprove?`<button data-approve-entry="${t.id}">Approve this ${t.kind}</button>`:''}${lineHTML}</div>`}).join(''):'<div class="card muted">No transactions posted yet.</div>';
$('entries').onclick=async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.approveEntry)await action('/transactions/'+b.dataset.approveEntry+'/approve');if(b.dataset.approveDelivery)await action('/deliveries/'+b.dataset.approveDelivery+'/approve');if(b.dataset.deliver){let qty=prompt('Number of delivered pieces (max '+b.dataset.max+')');if(qty===null)return;let n=Number(qty);if(!Number.isInteger(n)||n<=0||n>Number(b.dataset.max))throw Error('Enter a valid quantity');await action('/lines/'+b.dataset.deliver+'/deliveries',{qty:n})}}catch(err){alert(err.message)}};
$('audit').innerHTML=data.events.length?data.events.map(e=>`<div class="mini" style="padding:7px 0;border-bottom:1px solid #eef0f5"><b>${escapeHtml(e.verb)}</b> · ${escapeHtml(e.actor_name)} <span class="muted">${new Date(e.created_at).toLocaleString()}</span></div>`).join(''):'No events';}
async function action(path,body){try{await api(path,'POST',body);await detail(selected)}catch(e){alert(e.message)}}
function entryForm(kind,id,c){$('editor').innerHTML=`<div class="card"><h3>Propose ${kind}</h3><form id="txform"><div class="fields"><label><div class="label">Description</div><input name="description" required placeholder="Payment / adjustment reference"/></label><label><div class="label">Amount (${c})</div><input name="amount" type="number" step="0.01" min="0.01" required/></label></div><p class="hint muted">Debit increases the balance, credit reduces it. Only the other party can approve the entry.</p><button>Submit for other party's approval</button></form></div>`;$('txform').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));await action('/ledgers/'+id+'/entries',{kind,description:v.description,amount_minor:Math.round(Number(v.amount)*100)})}}
function invoiceForm(id,c){$('editor').innerHTML=`<div class="card"><h3>New supplier invoice</h3><form id="invoiceform"><label><div class="label">Invoice reference / description</div><input name="description" required placeholder="INV-1020"/></label><div id="lineInputs"></div><div class="stack" style="margin:12px 0"><button type="button" class="secondary" id="addLine">+ Add product line</button><button>Submit invoice for approval</button></div></form></div>`;let n=0;let add=()=>{n++;let d=document.createElement('div');d.className='entry';d.innerHTML=`<div class="fields"><label><div class="label">Item description</div><input class="l-desc" required placeholder="Embroidered suits"/></label><label><div class="label">Quantity (pieces)</div><input class="l-qty" type="number" min="1" step="1" required/></label><label><div class="label">Line total (${c})</div><input class="l-total" type="number" min="0.01" step="0.01" required/></label></div>`;$('lineInputs').appendChild(d)};$('addLine').onclick=add;add();$('invoiceform').onsubmit=async e=>{e.preventDefault();let lines=[...$('lineInputs').children].map(x=>({description:x.querySelector('.l-desc').value,qty:Number(x.querySelector('.l-qty').value),amount_minor:Math.round(Number(x.querySelector('.l-total').value)*100)}));await action('/ledgers/'+id+'/invoices',{description:e.target.description.value,lines})}}
boot();
</script></body></html>
